<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arborist · 生态门户</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { color-scheme: dark; }
      body {
        min-height: 100vh;
        font-family: -apple-system, 'SF Pro Text', 'PingFang SC', sans-serif;
        color: #e8eaee;
        -webkit-font-smoothing: antialiased;
        transition: background 2s ease;
      }
      /* 一天的氛围：晨 / 昼 / 暮 / 夜 */
      body.t-morning { background: linear-gradient(160deg, #1b2330 0%, #22303e 60%, #26333b 100%); }
      body.t-day { background: linear-gradient(160deg, #1e222b 0%, #262b34 60%, #2a2f38 100%); }
      body.t-dusk { background: linear-gradient(160deg, #211f28 0%, #2e2630 55%, #34292c 100%); }
      body.t-night { background: linear-gradient(160deg, #121318 0%, #181a21 60%, #1b1d24 100%); }

      .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 28px 64px; }

      header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 34px; }
      h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
      h1 .leaf { color: #46c07a; }
      .clock { font-size: 13px; color: #8b919c; font-variant-numeric: tabular-nums; }

      .summary { display: flex; gap: 10px; margin-bottom: 26px; flex-wrap: wrap; }
      .chip {
        font-size: 12px; padding: 4px 12px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.06); color: #9aa0ab;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .chip b { color: #e8eaee; font-weight: 600; }
      .chip.err b { color: #f85149; }
      .chip.ok b { color: #3fb950; }

      .banner {
        padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; line-height: 1.6;
      }
      .banner.error { background: rgba(248, 81, 73, 0.12); color: #ff9b94; }
      .banner.warn { background: rgba(210, 153, 34, 0.12); color: #e3b341; }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 14px; }

      .card {
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 14px;
        padding: 16px 16px 14px;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        display: flex; flex-direction: column; gap: 10px;
      }
      .card:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.08); }
      .card.state-error { border-color: rgba(248, 81, 73, 0.4); }
      .card.state-degraded { border-color: rgba(210, 153, 34, 0.4); }

      .card-top { display: flex; align-items: center; gap: 12px; }
      .card-icon {
        width: 40px; height: 40px; border-radius: 10px; flex: none;
        object-fit: contain; background: rgba(255, 255, 255, 0.07);
        display: flex; align-items: center; justify-content: center;
        font-size: 17px; font-weight: 700; color: #cbd2dc;
      }
      .card-title { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .card-tag {
        margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 6px; flex: none;
        color: #9aa0ab; background: rgba(255, 255, 255, 0.07);
      }

      .card-sub { font-size: 12px; color: #8b919c; min-height: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .card-foot { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #7a7f8a; }
      .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .dot.stopped { background: #62676f; }
      .dot.starting, .dot.stopping { background: #e6b450; animation: pulse 1.1s ease-in-out infinite; }
      .dot.running { background: #3fb950; box-shadow: 0 0 6px rgba(63, 185, 80, 0.55); }
      .dot.degraded { background: #d29922; }
      .dot.error { background: #f85149; }
      .dot.blocked { background: #db6d28; }
      @keyframes pulse { 50% { opacity: 0.35; } }

      .empty { padding: 80px 0; text-align: center; color: #7a7f8a; }
      .empty .big { font-size: 15px; color: #c7ccd4; margin-bottom: 8px; }

      .veil {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(10, 11, 14, 0.72); backdrop-filter: blur(4px);
        font-size: 14px; color: #c7ccd4; z-index: 10;
      }
      .veil.show { display: flex; }

      footer { margin-top: 40px; text-align: center; font-size: 11px; color: #565b64; }
    </style>
  </head>
  <body>
    <div class="veil" id="veil">与 Arborist 的连接中断，重连中…</div>
    <div class="wrap">
      <header>
        <h1><span class="leaf">✦</span> Arborist <span style="font-weight: 400; font-size: 14px; color: #8b919c">生态门户</span></h1>
        <div class="clock" id="clock"></div>
      </header>

      <div class="summary" id="summary"></div>
      <div id="banners"></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" style="display: none">
        <div class="big">还没有注册的 app</div>
        <div>在 ~/.arborist/config.toml 配置 roots，repo 根目录放 app.toml</div>
      </div>
      <footer>Arborist · 树艺师照看树林 · 每 5 秒刷新</footer>
    </div>

    <script>
      const stateLabel = {
        stopped: '已停止', starting: '启动中', running: '运行中',
        stopping: '停止中', error: '错误', blocked: '受阻', degraded: '降级'
      }

      const $ = (id) => document.getElementById(id)

      function theme() {
        const h = new Date().getHours()
        const t = h >= 5 && h < 10 ? 't-morning' : h >= 10 && h < 17 ? 't-day' : h >= 17 && h < 21 ? 't-dusk' : 't-night'
        document.body.className = t
      }

      function tick() {
        const now = new Date()
        $('clock').textContent = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
      }

      function iconHtml(app) {
        return app.icon
          ? '<img class="card-icon" src="' + app.icon + '" alt=""/>'
          : '<span class="card-icon">' + (app.title[0] || '?').toUpperCase() + '</span>'
      }

      function render(data) {
        const apps = data.apps || []
        const running = apps.filter((a) => a.state === 'running' || a.state === 'degraded').length
        const errors = apps.filter((a) => a.state === 'error').length
        $('summary').innerHTML =
          '<span class="chip ok"><b>' + running + '</b> 运行</span>' +
          '<span class="chip err"><b>' + errors + '</b> 异常</span>' +
          '<span class="chip"><b>' + apps.length + '</b> 注册</span>'

        const banners = []
        if (data.configError) banners.push('<div class="banner error">' + esc(data.configError) + '</div>')
        for (const e of data.errors || []) {
          banners.push('<div class="banner warn">' + esc((e.repoDir || '').split('/').pop()) + '：' + esc(e.message) + '</div>')
        }
        $('banners').innerHTML = banners.join('')

        $('empty').style.display = apps.length === 0 ? '' : 'none'
        $('grid').innerHTML = apps
          .map(function (a) {
            return '<div class="card state-' + a.state + '" data-name="' + esc(a.name) + '" data-type="' + a.type + '" data-url="' + esc(a.url || '') + '">' +
              '<div class="card-top">' + iconHtml(a) +
              '<span class="card-title">' + esc(a.title) + '</span>' +
              '<span class="card-tag">' + a.type + '</span></div>' +
              '<div class="card-sub">' + esc(a.line || stateLabel[a.state] || '') + '</div>' +
              '<div class="card-foot"><span class="dot ' + a.state + '"></span>' + stateLabel[a.state] + '</div>' +
              '</div>'
          })
          .join('')
      }

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
      }

      async function pull() {
        try {
          const res = await fetch('/api/apps', { headers: { 'x-arbor': '1' } })
          if (!res.ok) throw new Error(String(res.status))
          render(await res.json())
          $('veil').classList.remove('show')
        } catch {
          $('veil').classList.add('show')
        }
      }

      document.addEventListener('click', async (e) => {
        const card = e.target.closest('.card')
        if (!card) return
        if (card.dataset.type === 'web' && card.dataset.url) {
          window.open(card.dataset.url, '_blank')
          return
        }
        try {
          await fetch('/api/apps/' + card.dataset.name + '/open', {
            method: 'POST',
            headers: { 'x-arbor': '1' }
          })
        } catch { /* 下轮刷新可见 */ }
      })

      theme()
      tick()
      pull()
      setInterval(pull, 5000)
      setInterval(tick, 1000)
      setInterval(theme, 60000)
    </script>
  </body>
</html>
